name: Bug report / 缺陷报告
description: Report a defect in the firmware, BSP, hardware interface, or documentation.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include credentials, private device links, or personal data.
        感谢反馈。请勿提交凭证、私密设备链接或个人数据。
        Security vulnerabilities must be reported through .github/SECURITY.md, not through this form.
        安全漏洞必须按 .github/SECURITY.md 私密报告，不要填写在本表单。

  - type: textarea
    id: summary
    attributes:
      label: Summary / 问题概述
      description: What is broken, and what did you expect to happen instead?
      placeholder: A clear, concise description of the defect and the expected behavior.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Exact steps, commands, and inputs that trigger the defect.
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware version / 固件版本
      description: Provide a release version, branch name, or commit SHA.
      placeholder: "For example: v1.0.0 or 9e203eb"
    validations:
      required: true

  - type: input
    id: board
    attributes:
      label: Board revision / 板卡版本
      description: Use the production board or PCB revision; write Unknown if unsure.
      placeholder: "For example: production board or PCB rev; Unknown"
    validations:
      required: true

  - type: input
    id: idf
    attributes:
      label: ESP-IDF version / ESP-IDF 版本
      placeholder: "For example: v5.5.3"

  - type: textarea
    id: behavior
    attributes:
      label: Expected vs actual behavior / 期望与实际行为
      description: Describe what you expected and what actually happened.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or evidence / 已脱敏日志或证据
      description: Paste relevant logs, screenshots, or measurements after removing Wi-Fi credentials, tokens, device secrets, and personal data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 确认项
      options:
        - label: I searched existing issues and documentation. / 我已搜索已有 issue 和文档。
          required: true
        - label: I removed credentials, private device links, and personal data. / 我已移除凭证、私密设备链接和个人数据。
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md). / 这不是安全漏洞（安全漏洞请走 SECURITY.md）。
          required: true
